# Quick-start profile: in-memory H2 in MySQL-compatibility mode, with demo data.
spring.datasource.url=jdbc:h2:mem:smarthr;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
smarthr.seed.demo-data=true
