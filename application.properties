spring.application.name=smarthr

# Profile selection: h2 (default, zero setup) | mysql (production). Override with
#   -Dspring-boot.run.profiles=mysql   or   SPRING_PROFILES_ACTIVE=mysql
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.thymeleaf.cache=false
spring.web.resources.cache.cachecontrol.max-age=1h
server.servlet.session.timeout=30m
server.error.whitelabel.enabled=false

# SmartHR settings
smarthr.admin.email=admin@smarthr.com
smarthr.admin.password=Admin@123
smarthr.seed.demo-data=false
smarthr.attendance.late-after=09:45

# Hosting: listen on the platform's PORT and trust the proxy's HTTPS headers
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
