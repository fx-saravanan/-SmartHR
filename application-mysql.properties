# Production profile. Override with environment variables DB_URL, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smarthr?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.thymeleaf.cache=true
# Set SEED_DEMO_DATA=true on first start if you want sample employees and 24 months of leave history.
smarthr.seed.demo-data=${SEED_DEMO_DATA:false}
smarthr.admin.password=${ADMIN_PASSWORD:Admin@123}
