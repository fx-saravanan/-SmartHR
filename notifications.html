<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Notifications', 'notifications', ~{::section.page}, ~{})}">
<body>
<section class="page">
    <div class="page-head">
        <div>
            <h1>Notifications</h1>
            <p>Leave decisions, new requests and salary updates.</p>
        </div>
        <form th:action="@{/notifications/read-all}" method="post" th:if="${!items.isEmpty()}">
            <button class="btn btn-outline-primary" type="submit"><i class="bi bi-check2-all me-1"></i>Mark all as read</button>
        </form>
    </div>
    <div class="panel">
        <div class="note" th:each="n : ${items}" th:classappend="${!n.readFlag} ? 'unread'">
            <div class="d-flex justify-content-between gap-3">
                <div th:text="${n.message}">Message</div>
                <small class="text-secondary text-nowrap" th:text="${#temporals.format(n.createdAt, 'dd MMM, HH:mm')}">date</small>
            </div>
        </div>
        <div class="empty" th:if="${items.isEmpty()}">Nothing here yet. Updates about your requests will show up in this list.</div>
    </div>
</section>
</body>
</html>
